    <rect x="246" y="392" width="20" height="86" rx="10" fill="#f2d3a0"/>
    <rect x="222" y="316" width="68" height="98" rx="34" fill="#e08b2a" stroke="#ffffff" stroke-width="12"/>
  </g>
</svg>

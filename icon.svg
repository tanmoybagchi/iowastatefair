  <rect width="512" height="512" fill="#b7202e"/>
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Map pin -->
    <path d="M256 132c-46 0-83 37-83 83 0 58 83 145 83 145s83-87 83-145c0-46-37-83-83-83z"/>
    <circle cx="256" cy="215" r="30"/>
